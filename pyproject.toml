[project]
name = "api-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.124.4",
    "openai>=2.11.0",
    "psycopg2-binary>=2.9.11",
    "python-multipart>=0.0.20",
    "twilio>=9.8.8",
]



[project.scripts]
start = "main:start"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "/tests"]
exclude = [
  "*.json",
  "**/_compat.py",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D212", "FA", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "N999"]
"**/{tests,docs,tools}/*" = ["E402", "S101", "N999"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
verboseOutput = true
venvPath = "."
venv = ".venv"
